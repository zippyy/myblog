<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IGMP snooping on a GL.iNet router for IPTV</title>
  <desc id="desc">A network diagram showing an IPTV multicast stream passing through a GL.iNet router only to a subscribed television while unrelated devices are excluded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#182b49"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#65d5ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1440" cy="80" r="260" fill="#1f8fff" opacity="0.10"/>
  <circle cx="170" cy="820" r="300" fill="#18d0a0" opacity="0.08"/>

  <text x="110" y="120" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">IGMP Snooping for IPTV</text>
  <text x="112" y="177" fill="#a9bed6" font-family="Arial, Helvetica, sans-serif" font-size="29">Keep multicast streams on the ports that actually requested them</text>

  <g>
    <rect x="120" y="330" width="300" height="220" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="270" y="405" text-anchor="middle" fill="#17263a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">IPTV Provider</text>
    <rect x="190" y="446" width="160" height="48" rx="10" fill="#e8f6ff"/>
    <text x="270" y="479" text-anchor="middle" fill="#177fba" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">239.x.x.x</text>
  </g>

  <g>
    <rect x="650" y="285" width="330" height="310" rx="38" fill="#f7fbff"/>
    <rect x="710" y="350" width="210" height="120" rx="22" fill="#17263a"/>
    <circle cx="755" cy="507" r="10" fill="#37e48d"/>
    <circle cx="795" cy="507" r="10" fill="#65d5ff"/>
    <circle cx="835" cy="507" r="10" fill="#65d5ff"/>
    <text x="815" y="550" text-anchor="middle" fill="#17263a" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">GL.iNet Router</text>
    <text x="815" y="584" text-anchor="middle" fill="#567087" font-family="Arial, Helvetica, sans-serif" font-size="21">IGMP snooping enabled</text>
  </g>

  <g>
    <rect x="1190" y="240" width="290" height="210" rx="30" fill="#ffffff" opacity="0.96"/>
    <rect x="1253" y="284" width="164" height="100" rx="8" fill="#17263a"/>
    <rect x="1317" y="386" width="36" height="20" fill="#17263a"/>
    <text x="1335" y="430" text-anchor="middle" fill="#17263a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">IPTV / TV</text>
    <text x="1335" y="465" text-anchor="middle" fill="#168a66" font-family="Arial, Helvetica, sans-serif" font-size="20">Joined multicast group</text>
  </g>

  <g>
    <rect x="1190" y="550" width="290" height="190" rx="30" fill="#ffffff" opacity="0.92"/>
    <rect x="1245" y="590" width="90" height="64" rx="8" fill="#b8c8d8"/>
    <rect x="1360" y="590" width="62" height="64" rx="10" fill="#b8c8d8"/>
    <text x="1335" y="700" text-anchor="middle" fill="#17263a" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Other Devices</text>
    <text x="1335" y="730" text-anchor="middle" fill="#7d2e3b" font-family="Arial, Helvetica, sans-serif" font-size="18">No unwanted IPTV stream</text>
  </g>

  <line x1="420" y1="440" x2="635" y2="440" stroke="#65d5ff" stroke-width="12" marker-end="url(#arrow)"/>
  <text x="525" y="410" text-anchor="middle" fill="#aeeaff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Multicast</text>

  <line x1="980" y1="405" x2="1175" y2="350" stroke="#65d5ff" stroke-width="12" marker-end="url(#arrow)"/>
  <text x="1085" y="340" text-anchor="middle" fill="#aeeaff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Forward</text>

  <line x1="980" y1="505" x2="1170" y2="635" stroke="#e98696" stroke-width="7" stroke-dasharray="15 13"/>
  <circle cx="1080" cy="570" r="29" fill="#e98696"/>
  <path d="M1066 556 L1094 584 M1094 556 L1066 584" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <text x="110" y="820" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">TECH RELAY</text>
  <text x="315" y="820" fill="#8ba5bf" font-family="Arial, Helvetica, sans-serif" font-size="22">GL.iNet • OpenWrt • Multicast Networking</text>
</svg>
