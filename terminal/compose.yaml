services:
  terminal:
    build:
      context: .
    container_name: techrelay-terminal
    restart: unless-stopped
    environment:
      TECHRELAY_FEED_URL: https://techrelay.xyz/index.json
      TECHRELAY_SITE_URL: https://techrelay.xyz
      TECHRELAY_REFRESH_INTERVAL: 15m
    ports:
      - "2222:23234"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
