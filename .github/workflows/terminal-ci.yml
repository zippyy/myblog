name: Terminal app CI

on:
  pull_request:
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"
  push:
    branches:
      - master
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: terminal/go.mod
          cache: false
      - name: Normalize formatting
        run: gofmt -w .
      - name: Download modules
        run: go mod download
      - name: Vet
        run: |
          set +e
          go vet ./... > vet.txt 2>&1
          status=$?
          cat vet.txt
          exit "$status"
      - name: Upload vet diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-vet-diagnostics
          path: terminal/vet.txt
          if-no-files-found: error
      - name: Build
        run: go build ./cmd/techrelay-terminal
      - name: Build container
        run: docker build -t techrelay-terminal:test .
