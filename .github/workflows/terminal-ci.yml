name: Terminal app CI

on:
  pull_request:
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"
  push:
    branches:
      - master
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: terminal/go.mod
          cache: true
          cache-dependency-path: terminal/go.sum
      - name: Format and commit
        working-directory: .
        run: |
          gofmt -w terminal/cmd/techrelay-terminal
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add terminal/cmd/techrelay-terminal
            git commit -m "Format terminal renderer"
            git push
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/techrelay-terminal
      - name: Build container
        run: docker build -t techrelay-terminal:test .
