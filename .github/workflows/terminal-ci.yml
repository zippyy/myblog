name: Terminal app CI

on:
  pull_request:
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"
  push:
    branches:
      - master
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: terminal/go.mod
          cache: true
          cache-dependency-path: terminal/go.sum
      - name: Format source
        run: gofmt -w .
      - name: Commit formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          if git diff --quiet -- terminal/cmd; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/cmd
          git commit -m "Format terminal Go sources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/techrelay-terminal
      - name: Build container
        run: docker build -t techrelay-terminal:test .
