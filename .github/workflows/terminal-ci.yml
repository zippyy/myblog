name: Terminal app CI

on:
  pull_request:
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"
  push:
    branches:
      - master
    paths:
      - "terminal/**"
      - "layouts/index.json.json"
      - ".github/workflows/terminal-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: terminal/go.mod
          cache: true
          cache-dependency-path: terminal/go.sum
      - name: Normalize formatting
        run: |
          gofmt -w .
          git diff -- cmd > formatting.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: terminal-formatting-patch
          path: terminal/formatting.patch
          if-no-files-found: error
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/techrelay-terminal
      - name: Build container
        run: docker build -t techrelay-terminal:test .
